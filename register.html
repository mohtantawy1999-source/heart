<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>إنشاء حساب — {{ settings.site_name }}</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#1a3a2e,#0f2419,#1a4a3a);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:#fff;border-radius:18px;padding:36px 32px;width:400px;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.logo-wrap{text-align:center;margin-bottom:12px}
.logo-img{max-width:80px;max-height:80px;border-radius:12px}
h1{text-align:center;color:#1a3a2e;font-size:19px;margin-bottom:20px}
label{display:block;font-size:13px;color:#333;margin-bottom:5px;font-weight:600}
input{width:100%;padding:11px 13px;border:2px solid #e0e0e0;border-radius:9px;font-size:14px;margin-bottom:14px}
input[type=password],input[name=username]{direction:ltr}
input:focus{outline:none;border-color:#1a6e4a}
.btn{width:100%;padding:13px;background:#1a6e4a;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;margin-top:4px}
.btn:hover{background:#228a5c}
.flash{padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:14px}
.flash.error{background:#fde8e8;color:#c0392b}
.flash.success{background:#e8f8e8;color:#1e8449}
.back{text-align:center;margin-top:16px}
.back a{color:#888;font-size:13px;text-decoration:none}
.section-title{font-size:11px;color:#1a6e4a;font-weight:700;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.divider{height:1px;background:#f0f0f0;margin:14px 0}
</style>
</head>
<body>
<div class="card">
  <div class="logo-wrap">
    {% if settings.logo_data %}<img src="{{ settings.logo_data }}" class="logo-img" alt="">
    {% else %}<span style="font-size:40px">🌙</span>{% endif %}
  </div>
  <h1>إنشاء حساب جديد</h1>
  {% for msg in get_flashed_messages(with_categories=True) %}
    <div class="flash {{ msg[0] }}">{{ msg[1] }}</div>
  {% endfor %}
  <form method="POST">
    <div class="section-title">الاسم</div>
    <label>الاسم المعروض</label>
    <input type="text" name="display_name" placeholder="اسمك كما سيظهر للآخرين">
    <div class="divider"></div>
    <div class="section-title">بيانات الدخول</div>
    <label>اسم المستخدم</label>
    <input type="text" name="username" placeholder="username" required autocomplete="username">
    <label>كلمة السر</label>
    <input type="password" name="password" placeholder="••••••••" required minlength="4">
    <label>تأكيد كلمة السر</label>
    <input type="password" name="password2" placeholder="••••••••" required minlength="4">
    <button type="submit" class="btn">✅ إنشاء الحساب</button>
  </form>
  <div class="back"><a href="/login">← عندي حساب بالفعل</a></div>
</div>
</body>
</html>
